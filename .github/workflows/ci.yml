name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Environment info
        run: |
          node -v
          npm -v
          pwd
          ls -la

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Install optional dev dependency (Zod) for validation checks
        run: npm install zod --no-audit --no-fund || true

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run lint || true
      - name: Run smoke tests
        run: |
          # run a few API smoke checks against the built server (spawn server briefly)
          node dist/server.cjs &
          npx -y wait-on http://localhost:3000
          curl -f http://localhost:3000/api/phone/state
